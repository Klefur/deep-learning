name: env
channels:
  - pytorch
  - nvidia
  - conda-forge
  - nodefaults
dependencies:
  - python=3.10

  # Librerías de Ciencia de Datos
  - numpy
  - matplotlib
  - seaborn
  - scikit-learn
  - jupyterlab
  - ipykernel

  # PyTorch con soporte para GPU
  # *** CAMBIO CLAVE: CUDA 11.8 para máxima compatibilidad ***
  - pytorch
  - torchvision
  - torchaudio
  - pytorch-cuda=11.8

  # Pip
  - pip
  - pip:
      - kagglehub
